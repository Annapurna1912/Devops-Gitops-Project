apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-gitops-app
  template:
    metadata:
      labels:
        app: devops-gitops-app
    spec:
      containers:
        - name: devops-gitops-app
          image: annapurna1993/devops-gitops-app:latest

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: devops-gitops-config
                  key: APP_ENV

            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-gitops-secret
                  key: APP_SECRET

          ports:
            - containerPort: 3000

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
