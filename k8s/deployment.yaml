apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-gitops-app
  template:
    metadata:
      labels:
        app: devops-gitops-app
    spec:
      containers:
        - name: devops-gitops-app
          image: annapurna1993/devops-gitops-app:latest
          ports:
            - containerPort: 3000
